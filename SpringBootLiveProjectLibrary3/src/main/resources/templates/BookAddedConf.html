<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Request Submitted</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #36d1dc, #5b86e5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .success {
            font-size: 22px;
            color: green;
            margin-bottom: 15px;
        }

        .msg {
            font-size: 16px;
            color: #333;
        }

        .btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #5b86e5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background: #36d1dc;
        }
    </style>
</head>
<body>

<div class="box">
    <div class="success">✅ Book Added Successfully!</div>

</div>

</body>
</html>
